function issue(qty){if(!Number.isSafeInteger(qty)||qty<1)return 'Enter a positive whole number of shares.';if(ticket.side==='buy'&&round(qty*byId[ticket.id].price)>state.cash)return 'This order exceeds your available demo cash.';if(ticket.side==='sell'&&qty>(state.hold[ticket.id]?.[0]||0))return 'This quantity exceeds your available shares.';return ''}

const overseas = {
  ALDR: {name:'Alder Cloud', region:'United States', currency:'USD', price:72.5, fx:84},
  HOSHI: {name:'Hoshi Robotics', region:'Japan', currency:'JPY', price:4200, fx:.56},
  BRML: {name:'Bramley Power', region:'United Kingdom', currency:'GBP', price:18.4, fx:108}
};
const incomeNote = {name:'Meridian Infrastructure Note', price:1000, coupon:6.5};
const funds = {index:{name:'Ledger Broad Market Fund', nav:50}, debt:{name:'Ledger Short Duration Fund',nav:25}};
const loanTerms = {
  education:{name:'Education loan',rate:8,months:24,original:60000},
  personal:{name:'Personal loan',rate:12,months:12,original:15000}
};
const journalSections={accounts:'Accounts',global:'Global stocks',sips:'SIPs',income:'Fixed income',loans:'Loans'};
state.ledger ??= {bank:95000, foreign:{ALDR:2,HOSHI:3,BRML:0}, bondUnits:10,
  installments:{index:{monthly:2500,capital:7500},debt:{monthly:0,capital:0}},
  cycle:0,loans:{education:60000,personal:15000},activity:[]};
const ledger=state.ledger;
const totalOf=(obj,fn)=>Object.entries(obj).reduce((a,[k,v])=>a+fn(k,v),0);
const inrQuote=s=>round(s.price*s.fx);
const foreignTotal=()=>totalOf(overseas,(k,s)=>ledger.foreign[k]*inrQuote(s));
const sipValue=()=>totalOf(ledger.installments,(_,s)=>s.capital);
const outstanding=()=>totalOf(ledger.loans,(_,n)=>n);
const bondValue=()=>ledger.bondUnits*incomeNote.price;
const assets=()=>round(ledger.bank+state.cash+invested()+foreignTotal()+sipValue()+bondValue());
const netWorth=()=>round(assets()-outstanding());
const localQuote=s=>new Intl.NumberFormat('en-IN',{style:'currency',currency:s.currency}).format(s.price);
function ledgerSummary(home=false){
 const summary='<div class="nettop"><div><span class="presslabel">Demo balance sheet · INR</span><h1>Your net worth</h1><strong>'+money(netWorth())+'</strong></div><div class="netmeta"><div>Total assets <b>'+money(assets())+'</b></div><div>Outstanding debt <b>'+money(outstanding())+'</b></div></div></div>';
 return '<section class="netcard">'+summary+'<div class="ledgerlinks">'+Object.entries(journalSections).map(([key,name])=>'<a href="#wealth/'+key+'">'+name+'</a>').join('')+'</div></section>'+(home?quickDesk()+'<h2 class="blocktitle">Domestic portfolio</h2>':'')
}

function emi(k){
 const t=loanTerms[k],r=t.rate/1200;
 return round(t.original*r/(1-Math.pow(1+r,-t.months)))

let financeDraft=null;
function financeTicket(action,k){
 const s=overseas[k],f=funds[k],loan=loanTerms[k];
 const config={
   deposit:['Fund brokerage','Transfer from bank savings. Available '+money(ledger.bank),'Amount (₹)'],
   withdraw:['Return cash to bank','Transfer from brokerage cash. Available '+money(state.cash),'Amount (₹)'],
   globalBuy:['Buy international shares',s?s.name+' · '+localQuote(s)+' / '+money(inrQuote(s))+' each':'','Whole shares'],
   globalSell:['Sell international shares',s?s.name+' · '+ledger.foreign[k]+' shares held':'','Whole shares'],
   bondBuy:['Buy fixed-income units',incomeNote.name+' · '+money(incomeNote.price)+' per unit','Whole units'],
   bondSell:['Sell fixed-income units',ledger.bondUnits+' units held · '+money(incomeNote.price)+' per unit','Whole units'],
   sipEdit:['Set monthly SIP',f?f.name+' · Enter zero to pause future contributions.':'','Monthly amount (₹)'],
   sipRun:['Run one SIP month','This applies one contribution to each active fund using demo bank savings.'],
   loanPay:['Pay loan instalment',loan?loan.name+' · From demo bank savings.':'']
 };
 const [heading,hint,field]=config[action];financeDraft={action,k};const min=action==='sipEdit'?0:1;
 openModal(heading,'<p>'+hint+'</p><form id="finform">'+(field?'<label for="finamount">'+field+'</label><input id="finamount" type="number" step="1" min="'+min+'" max="100000000" value="'+(action==='sipEdit'?ledger.installments[k].monthly:min)+'" required>':'')+'<p id="findetail" class="summary"></p><p role="alert" class="error" id="finerror"></p><button class="primary">Confirm simulation</button></form>');refreshFinanceTicket()
}
function financeQuote(action,k,n){
 const buy=['globalBuy','bondBuy'].includes(action),sell=['globalSell','bondSell'].includes(action);
 let value=n,error='',detail='';
 if(buy||sell){
   const global=action.startsWith('global'),units=global?ledger.foreign[k]:ledger.bondUnits;
   value=round(n*(global?inrQuote(overseas[k]):incomeNote.price));detail=(buy?'Debit from':'Credit to')+' brokerage wallet · '+money(value);
   if(sell&&n>units)error='This quantity exceeds your holdings.';
 }else if(action==='loanPay'){
   const p=payment(k);value=p.total;detail='Payment '+money(value)+' · Principal '+money(p.principal)+' · Interest '+money(p.interest);
   if(!value)error='This loan has been repaid.';
 }else if(action==='sipRun'){
   value=totalOf(ledger.installments,(_,s)=>s.monthly);detail='Bank debit '+money(value)+' for demo month '+(ledger.cycle+1)+'.';
   if(!value)error='Set a monthly amount on at least one fund first.';
 }else if(action==='sipEdit'){detail=n?'Monthly contribution '+money(n)+'. Your bank will be debited when you run a demo month.':'Future contributions paused. Existing fund units stay invested.'}
 else detail='Transfer '+money(n)+' between your demo accounts.';
 if(['deposit','loanPay','sipRun'].includes(action)&&value>ledger.bank)error='Insufficient demo bank balance.';
 if((buy||action==='withdraw')&&value>state.cash)error='Insufficient brokerage cash. Fund your brokerage wallet from Accounts.';
 return {value,error,detail}
}
function refreshFinanceTicket(){
 if(!financeDraft)return;const input=modal.querySelector('#finamount');const valid=!input||input.validity.valid;
 const {action,k}=financeDraft;const q=financeQuote(action,k,valid&&input?Number(input.value):0);
 const message=valid?q.error:'Enter a whole number within the displayed limits.';
 modal.querySelector('#findetail').textContent=valid?q.detail:'';
 modal.querySelector('#finerror').textContent=message;modal.querySelector('#finform button').disabled=Boolean(message)
}

document.addEventListener('input',e=>{if(e.target.id==='finamount')refreshFinanceTicket()});
document.addEventListener('submit',e=>{
 if(e.target.id!=='finform'||!financeDraft)return;e.preventDefault();const {action,k}=financeDraft;
 const input=e.target.querySelector('input');if(input&&!input.reportValidity())return;const n=input?Number(input.value):0;
 const {value,error}=financeQuote(action,k,n);if(error){refreshFinanceTicket();return}
 let label;
 switch(action){
   case 'deposit':case 'withdraw':{const shift=action==='deposit'?value:-value;ledger.bank=round(ledger.bank-shift);state.cash=round(state.cash+shift);label=shift>0?'Bank → brokerage':'Brokerage → bank';break}
   case 'globalBuy':case 'globalSell':case 'bondBuy':case 'bondSell':{const dir=action.endsWith('Buy')?1:-1;state.cash=round(state.cash-dir*value);if(action.startsWith('global'))ledger.foreign[k]+=dir*n;else ledger.bondUnits+=dir*n;label=(dir>0?'Bought ':'Sold ')+n+' × '+(k||incomeNote.name);break}
   case 'loanPay':{const p=payment(k);ledger.bank=round(ledger.bank-p.total);ledger.loans[k]=round(ledger.loans[k]-p.principal);label=loanTerms[k].name+' instalment';break}
   case 'sipEdit':ledger.installments[k].monthly=n;label=funds[k].name+' monthly plan';break;
   case 'sipRun':ledger.bank=round(ledger.bank-value);for(const plan of Object.values(ledger.installments))plan.capital=round(plan.capital+plan.monthly);ledger.cycle++;label='SIP contributions · month '+ledger.cycle;break;
 }
 ledger.activity.push({label,value});save();financeDraft=null;modal.close();render();notify(label+' · '+money(value))
});
